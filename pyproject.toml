[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-build-log-producer"
version = "0.1.0"
description = "Script to MP4 on an 8 GB GPU: local TTS, alignment and diagram rendering"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Molina" }]
requires-python = ">=3.11,<3.12"

[project.urls]
Channel = "https://www.youtube.com/@thebuildlogdm"
Homepage = "https://personal-landing-beta-neon.vercel.app/"

[tool.setuptools.packages.find]
where = ["src"]
